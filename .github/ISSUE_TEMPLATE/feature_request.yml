name: Feature request
description: Suggest a new check, option, output format or record type
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: CLI flags, JSON fields or output you have in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
