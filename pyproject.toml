[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dns-propagation"
dynamic = ["version"]
description = "Check DNS propagation across 20+ public resolvers (UDP and DoH) at once: propagation table, consistency %, expected values, watch mode for CI, JSON output and SPF/DMARC/DKIM checks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Saizul Amin" }]
keywords = ["dns", "dns-propagation", "dnspython", "doh", "dns-over-https", "spf", "dmarc", "dkim", "devops", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "dnspython[doh]>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/saizul/dns-propagation"
Issues = "https://github.com/saizul/dns-propagation/issues"
Changelog = "https://github.com/saizul/dns-propagation/blob/main/CHANGELOG.md"

[project.scripts]
dns-propagation = "dns_propagation.cli:main"

[tool.setuptools.dynamic]
version = { attr = "dns_propagation._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dns_propagation = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["SIM108", "RUF022", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
